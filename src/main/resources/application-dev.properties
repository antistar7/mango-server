# 로컬 개발용 프로파일
# 로컬 MariaDB(docker mango-mariadb)는 3307로 매핑되어 있다.

# MANGO DB
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/mango}
spring.datasource.username=${DB_USERNAME:mango}
spring.datasource.password=${DB_PASSWORD:mango_pass}

# Fukuoka DB
fukuoka.datasource.url=${FUKUOKA_DB_URL:jdbc:mariadb://localhost:3307/mango_fukuoka}
fukuoka.datasource.username=${FUKUOKA_DB_USERNAME:mango}
fukuoka.datasource.password=${FUKUOKA_DB_PASSWORD:mango_pass}

# 로컬 관리자 계정. 평문({noop})은 dev 프로파일에서만 허용된다.
mango.admin.username=${ADMIN_USERNAME:admin}
mango.admin.password=${ADMIN_PASSWORD:{noop}admin}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.mango=DEBUG

spring.application.name=mango-server

# =========================================================
# MANGO DB
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/mango}
spring.datasource.username=${DB_USERNAME:mango}
spring.datasource.password=${DB_PASSWORD:mango_pass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# =========================================================
# Fukuoka DB
# =========================================================
fukuoka.datasource.url=${FUKUOKA_DB_URL:jdbc:mariadb://localhost:3306/mango_fukuoka}
fukuoka.datasource.username=${FUKUOKA_DB_USERNAME:mango}
fukuoka.datasource.password=${FUKUOKA_DB_PASSWORD:mango_pass}
fukuoka.datasource.driver-class-name=org.mariadb.jdbc.Driver


# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=validate


# =========================================================
# Flyway
# =========================================================
spring.flyway.url=${DB_URL:jdbc:mariadb://localhost:3307/mango}
spring.flyway.user=${DB_USERNAME:mango}
spring.flyway.password=${DB_PASSWORD:mango_pass}
spring.flyway.driver-class-name=org.mariadb.jdbc.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# =========================================================
# Server
# =========================================================
server.port=${SERVER_PORT:8080}

spring.profiles.default=prod